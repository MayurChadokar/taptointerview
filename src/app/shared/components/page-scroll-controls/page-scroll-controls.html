<div class="scroll-controls" role="group" aria-label="Page scroll controls">
  <button type="button" aria-label="Scroll to top" title="Back to top" [disabled]="atTop()" (click)="scrollTo('top')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6" /></svg>
  </button>
  <span class="divider" aria-hidden="true"></span>
  <button type="button" aria-label="Scroll to bottom" title="Go to bottom" [disabled]="atBottom()" (click)="scrollTo('bottom')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6" /></svg>
  </button>
</div>
